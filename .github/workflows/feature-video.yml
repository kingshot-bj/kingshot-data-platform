name: Feature video

# 機能紹介の縦長動画（字幕つき・1080×1920）を作って Artifact に置く。手動で動かす（iPhone の GitHub アプリの「Run workflow」からも動かせる）。
# 場面は scripts/social/scenes/<set>.json。ログインが必要な場面は、Secrets に EAGLEEYE_VIDEO_TOKEN があるときだけ撮る（無ければ飛ばす）。
# 撮影中は広告・アクセス記録の通信を止め、サーバーは裏で MightPulse に取りに行かない（API Pool を使わない）。
on:
  workflow_dispatch:
    inputs:
      scene_set:
        description: "場面セット"
        type: choice
        options: [features, alliance-compare]
        default: features
      bgm:
        description: "BGMのファイル（リポジトリ内のパス。空ならBGMなし）"
        type: string
        default: ""
      fade:
        description: "場面の切り替えのフェード（秒）"
        type: string
        default: "0.4"

permissions:
  contents: read

concurrency:
  group: feature-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-media
      - name: Build the video
        env:
          EAGLEEYE_VIDEO_TOKEN: ${{ secrets.EAGLEEYE_VIDEO_TOKEN }}
          SCENE_SET: ${{ inputs.scene_set }}
          BGM: ${{ inputs.bgm }}
          FADE: ${{ inputs.fade }}
        run: |
          args=(feature-video-out --set "$SCENE_SET" --fade "$FADE")
          if [ -n "$BGM" ]; then args+=(--bgm "$BGM"); fi
          node scripts/social/feature-video.mjs "${args[@]}"
      - name: Keep the video as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: feature-video-${{ inputs.scene_set }}
          path: feature-video-out
          retention-days: 30
