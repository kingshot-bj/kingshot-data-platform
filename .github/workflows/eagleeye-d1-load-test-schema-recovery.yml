name: EagleEye D1 Load Test Schema Recovery

on:
  workflow_dispatch:

jobs:
  apply-load-test-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify current schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 execute eagleeye-db --remote --command "PRAGMA table_info(kingdom_load_test_runs);" --json > before.json
          cat before.json

      - name: Apply Load Test schema 0030-0032
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 execute eagleeye-db --remote --command "ALTER TABLE kingdom_load_test_runs ADD COLUMN api_concurrency INTEGER NOT NULL DEFAULT 0;"
          wrangler d1 execute eagleeye-db --remote --command "ALTER TABLE kingdom_load_test_runs ADD COLUMN success_count INTEGER NOT NULL DEFAULT 0; ALTER TABLE kingdom_load_test_runs ADD COLUMN failed_count INTEGER NOT NULL DEFAULT 0; ALTER TABLE kingdom_load_test_runs ADD COLUMN ranking_rows_saved INTEGER NOT NULL DEFAULT 0; ALTER TABLE kingdom_load_test_runs ADD COLUMN player_rows_saved INTEGER NOT NULL DEFAULT 0; ALTER TABLE kingdom_load_test_runs ADD COLUMN elapsed_ms INTEGER;"
          wrangler d1 execute eagleeye-db --remote --command "ALTER TABLE kingdom_load_test_runs ADD COLUMN api_active_count INTEGER NOT NULL DEFAULT 0; ALTER TABLE kingdom_load_test_runs ADD COLUMN api_waiting_count INTEGER NOT NULL DEFAULT 0; ALTER TABLE kingdom_load_test_runs ADD COLUMN api_pool_waiting_count INTEGER NOT NULL DEFAULT 0; ALTER TABLE kingdom_load_test_runs ADD COLUMN api_wait_events INTEGER NOT NULL DEFAULT 0; ALTER TABLE kingdom_load_test_runs ADD COLUMN api_pool_wait_events INTEGER NOT NULL DEFAULT 0; ALTER TABLE kingdom_load_test_runs ADD COLUMN api_wait_ms INTEGER NOT NULL DEFAULT 0; ALTER TABLE kingdom_load_test_runs ADD COLUMN api_pool_wait_ms INTEGER NOT NULL DEFAULT 0; ALTER TABLE kingdom_load_test_runs ADD COLUMN last_activity_at INTEGER NOT NULL DEFAULT 0;"

      - name: Verify recovered schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 execute eagleeye-db --remote --command "PRAGMA table_info(kingdom_load_test_runs);" --json > after.json
          cat after.json
          node <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("after.json", "utf8"));
          const rows = (data[0]?.results || []).map(r => r.name);
          const required = [
            "api_concurrency",
            "success_count",
            "failed_count",
            "ranking_rows_saved",
            "player_rows_saved",
            "elapsed_ms",
            "api_active_count",
            "api_waiting_count",
            "api_pool_waiting_count",
            "api_wait_events",
            "api_pool_wait_events",
            "api_wait_ms",
            "api_pool_wait_ms",
            "last_activity_at"
          ];
          const missing = required.filter(name => !rows.includes(name));
          if (missing.length) {
            console.error("Missing columns:", missing.join(", "));
            process.exit(1);
          }
          console.log("Load Test schema verification: OK");
          NODE
