name: EagleEye D1 Read-only Probe Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-probe-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing."; exit 1; }

      - name: Read Probe migration journal and schema (SELECT only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          MIGRATION_JSON="$(wrangler d1 execute eagleeye-db --remote --json --command "SELECT name FROM d1_migrations WHERE name LIKE '%mightpulse_probe%' OR name IN ('0061_mightpulse_probe_runs.sql','0062_mightpulse_probe_keys.sql','0063_mightpulse_probe_batches.sql','0064_mightpulse_probe_key_audit.sql','0065_mightpulse_probe_batch_lease.sql') ORDER BY name;")"
          SCHEMA_JSON="$(wrangler d1 execute eagleeye-db --remote --json --command "SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='mightpulse_probe_runs') AS runs_table,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='mightpulse_probe_keys') AS keys_table,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='mightpulse_probe_batches') AS batches_table,
            (SELECT group_concat(name, ',') FROM pragma_table_info('mightpulse_probe_runs')) AS run_columns,
            (SELECT group_concat(name, ',') FROM pragma_table_info('mightpulse_probe_keys')) AS key_columns,
            (SELECT group_concat(name, ',') FROM pragma_table_info('mightpulse_probe_batches')) AS batch_columns;")"
          export MIGRATION_JSON SCHEMA_JSON
          node <<'NODE'
          const migrationPayload = JSON.parse(process.env.MIGRATION_JSON);
          const schemaPayload = JSON.parse(process.env.SCHEMA_JSON);
          const migrations = migrationPayload?.[0]?.results ?? [];
          const schema = schemaPayload?.[0]?.results?.[0] ?? {};
          const names = migrations.map(row => String(row.name || ""));
          console.log("READ-ONLY PROBE D1 AUDIT");
          console.log(JSON.stringify({
            migration_names: names,
            schema: {
              runs_table: Number(schema.runs_table || 0) === 1,
              keys_table: Number(schema.keys_table || 0) === 1,
              batches_table: Number(schema.batches_table || 0) === 1,
              run_columns: String(schema.run_columns || "").split(",").filter(Boolean),
              key_columns: String(schema.key_columns || "").split(",").filter(Boolean),
              batch_columns: String(schema.batch_columns || "").split(",").filter(Boolean)
            },
            writes_performed: false
          }, null, 2));
          NODE
