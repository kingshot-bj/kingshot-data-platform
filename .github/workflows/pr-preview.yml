name: PR preview

# PR ごとにプレビュー（workers.dev）を作り、URL を PR にコメントする。
# プレビューは本番の D1・R2 を読むだけ（src/preview-readonly.js）。ログインなしの画面の確認用。
# シークレット CLOUDFLARE_PREVIEW_API_TOKEN（Workers スクリプト：編集 だけ）が無いときは何もしない。

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  WRANGLER_VERSION: 4.162.0
  CLOUDFLARE_ACCOUNT_ID: 991e65e37de26f2e996fe296ab0d1a3a
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          PREVIEW_LOGIN_KEY: ${{ secrets.PREVIEW_LOGIN_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_PREVIEW_API_TOKEN is not set; skipping"; echo "url=" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 疑似ログイン用：セッション鍵はデプロイごとに作り直す（本番の鍵は使わない）。合言葉は GitHub のシークレット。
          umask 077
          node -e 'const c=require("crypto");const o={EAGLEEYE_SESSION_SECRET:c.randomBytes(32).toString("hex")};if(process.env.PREVIEW_LOGIN_KEY)o.PREVIEW_LOGIN_KEY=process.env.PREVIEW_LOGIN_KEY;require("fs").writeFileSync(process.env.RUNNER_TEMP+"/preview-secrets.json",JSON.stringify(o))'
          npx -y "wrangler@$WRANGLER_VERSION" preview --name "$PREVIEW_NAME" --var EAGLEEYE_ENV:preview --secrets-file "$RUNNER_TEMP/preview-secrets.json" --message "PR #${{ github.event.pull_request.number }} ${GITHUB_SHA::7}" > preview.log 2>&1 || { rm -f "$RUNNER_TEMP/preview-secrets.json"; tail -n 40 preview.log; exit 1; }
          rm -f "$RUNNER_TEMP/preview-secrets.json"
          tail -n 20 preview.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev[^ "]*' preview.log | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- eagleeye-pr-preview -->'
          body="$marker
          🧪 プレビュー：$URL
          疑似ログイン：$URL/preview/login（合言葉は PREVIEW_LOGIN_KEY）
          （${GITHUB_SHA::7} 時点・本番データを読むだけ・保存する操作は保存されない）"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null; else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null; fi

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete preview
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          npx -y "wrangler@$WRANGLER_VERSION" preview delete --name "$PREVIEW_NAME" --skip-confirmation
