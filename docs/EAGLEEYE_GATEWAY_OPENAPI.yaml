openapi: 3.0.3
info:
  title: EagleEye Read-Only Gateway API
  version: 1.0.0
  description: Read-only operational gateway for ChatGPT/JARVIS access to EagleEye.
servers:
  - url: https://kingshot-data-platform.black-jack-kingshot.workers.dev
security:
  - bearerAuth: []
paths:
  /api/gateway/v1/status:
    get:
      operationId: getEagleEyeSystemStatus
      summary: Get current EagleEye system status
      description: Returns normalized operational state and existing Cloudflare resource analytics. Read-only.
      responses:
        '200':
          description: Current EagleEye status
        '401':
          description: Unauthorized
        '503':
          description: Gateway secret is not configured
  /api/gateway/v1/diagnostics:
    get:
      operationId: getEagleEyeDiagnostics
      summary: Get recent EagleEye diagnostics
      description: Returns recent normalized diagnostic events. Read-only.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: Recent diagnostics
        '401':
          description: Unauthorized
        '503':
          description: Gateway secret is not configured
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
