# Claude Code（GitHub 連携）。Issue や PR のコメントで「@claude」と書くと、Claude がコードを書いて PR を作る。
# - JARVIS（主人の AI 秘書）が主人の承認のもとで Issue を立て、ここで Claude が実装する（2026-11-21 主人の決定）。
# - 起動できるのは、このリポジトリに書き込み権限がある人だけ（action の既定。公開リポジトリでも他人は起動できない）。
# - 費用は主人の Claude のサブスクリプションの枠（CLAUDE_CODE_OAUTH_TOKEN）。
# - Claude が作るのは PR まで。マージ（本番への反映）は主人が決める。
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 40"
